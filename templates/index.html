<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main class="container">
        <header>
            <h1>Welcome to EduGenie 🧠✨</h1>
            <p>Your personal AI tutor for learning support</p>
        </header>

        <section class="card">
            <h2>Ask EduGenie a Question</h2>
            <input id="qaInput" type="text" placeholder="e.g. What is the largest ocean?">
            <button onclick="askQuestion()">Get Answer</button>
            <div id="qaResult" class="result"></div>
        </section>

        <section class="card">
            <h2>Need an Explanation?</h2>
            <input id="explainInput" type="text" placeholder="e.g. Quantum Computing">
            <button onclick="explainTopic()">Explain</button>
            <div id="explainResult" class="result"></div>
        </section>

        <section class="card">
            <h2>Summarize a Paragraph</h2>
            <textarea id="summaryInput" placeholder="Paste long content to summarize"></textarea>
            <button onclick="summarizeText()">Summarize</button>
            <div id="summaryResult" class="result"></div>
        </section>

        <section class="card">
            <h2>Generate a Quiz</h2>
            <input id="quizInput" type="text" placeholder="e.g. Pythagoras theorem">
            <button onclick="generateQuiz()">Generate Quiz</button>
            <div id="quizResult" class="result"></div>
        </section>

        <section class="card">
            <h2>Get Learning Recommendations</h2>
            <input id="learnInput" type="text" placeholder="e.g. SQL">
            <button onclick="getRecommendations()">Get Recommendations</button>
            <div id="learnResult" class="result"></div>
        </section>
    </main>

    <script>
        function showResult(id, content) {
            document.getElementById(id).innerHTML = content;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function askQuestion() {
            const question = document.getElementById("qaInput").value.trim();
            if (!question) return;

            const response = await fetch(`/qa?question=${encodeURIComponent(question)}`);
            const data = await response.json();

            showResult(
                "qaResult",
                `<strong>Answer:</strong><p>${escapeHtml(data.answer || data.error)}</p>`
            );
        }

        async function explainTopic() {
            const topic = document.getElementById("explainInput").value.trim();
            if (!topic) return;

            const response = await fetch("/explain", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({topic})
            });

            const data = await response.json();

            showResult(
                "explainResult",
                `<strong>Explanation:</strong><p>${escapeHtml(data.explanation || data.error)}</p>`
            );
        }

        async function summarizeText() {
            const text = document.getElementById("summaryInput").value.trim();
            if (!text) return;

            const response = await fetch("/summarize", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text})
            });

            const data = await response.json();

            showResult(
                "summaryResult",
                `<strong>Summary:</strong><p>${escapeHtml(data.summary || data.error)}</p>`
            );
        }

        async function generateQuiz() {
            const text = document.getElementById("quizInput").value.trim();
            if (!text) return;

            const response = await fetch("/quiz", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text})
            });

            const data = await response.json();
            const quiz = data.quiz || [];

            if (!Array.isArray(quiz)) {
                showResult("quizResult", `<p>${escapeHtml(String(quiz))}</p>`);
                return;
            }

            showResult(
                "quizResult",
                quiz.map((item, index) => `
                    <div class="quiz-question">
                        <strong>Q${index + 1}. ${escapeHtml(item.question || item.error || "")}</strong>
                        ${(item.options || []).map(option =>
                            `<div class="option">${escapeHtml(option)}</div>`
                        ).join("")}
                        ${item.answer ? `<p><strong>Answer:</strong> ${escapeHtml(item.answer)}</p>` : ""}
                    </div>
                `).join("")
            );
        }

        async function getRecommendations() {
            const topic = document.getElementById("learnInput").value.trim();
            if (!topic) return;

            const response = await fetch(
                `/learn/recommendations?topic=${encodeURIComponent(topic)}`
            );

            const data = await response.json();

            showResult(
                "learnResult",
                `<strong>Learning Path:</strong><pre>${escapeHtml(
                    data.recommendation || data.error
                )}</pre>`
            );
        }
    </script>
</body>
</html>
